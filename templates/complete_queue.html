<!DOCTYPE html>
<html>

<head>

    <title>Complete Queue - Smart Queue</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Complete Queue</h1>

    <p>
        Service:
        <strong>{{ queue["service"] }}</strong>
    </p>

    <p>
        Queue Number:
        <strong>#{{ queue["queue_number"] }}</strong>
    </p>

    <p>
        User:
        <strong>{{ queue["user_id"] }}</strong>
    </p>


    <hr>


    <h2>Actual Service Time</h2>

    <p>
        Enter approximately how many minutes
        the service took.
    </p>


    <form
        method="POST"
        action="/complete/{{ queue['id'] }}"
    >

        <input
            type="number"
            name="service_duration"
            min="1"
            max="60"
            step="0.5"
            placeholder="Example: 3"
            required
        >

        <br><br>

        <button type="submit">
            Complete Queue
        </button>

    </form>


    <br>

    <a href="/admin">
        Cancel
    </a>

</div>

</body>

</html>
